  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://zhaolinwei-Clark.github.io/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/zhaolin-wei-82272b2b8?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BXwq8ihPcQcq5fPOAKRbFNw%3D%3D"
    - label: "GitHub"
