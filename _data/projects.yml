    "id": "shaft",
    "modal_id": "m-shaft",
    "category": "cat-mech",
    "title": "S45C Motor Shaft Fatigue Failure Analysis",
    "card_title_html": "S45C Motor Shaft Fatigue Failure Analysis",
    "summary_html": "Root-cause investigation of industrial motor shaft fatigue crack — SEM fracture analysis, stress concentration evaluation, heat treatment audit and redesign recommendation.",
    "tags": [
      "Fatigue",
      "FEA",
      "Root Cause",
      "Mechanical"
    ],
    "filter_tags": [
      "Root Cause Analysis",
      "Mechanical",
      "Fatigue",
      "FEA"
    ],
    "card_media_html": "\n          <div class=\"card-img-split\">\n            <img src=\"/images/fuwode/Image_motor fracture.png\" alt=\"Shaft fracture\">\n            <img src=\"/images/fuwode/Image_fatigue.jpg\" alt=\"Shaft fatigue analysis\">\n          </div>\n        ",
    "detail_title_html": null,
    "context_html": "Failure Analysis · Fuwode Machinery Co., Ltd.",
    "detail_summary_html": "Root-cause investigation of premature shaft failure in service. Identified rotational bending fatigue at a stress-concentrating shoulder, exacerbated by improper induction hardening process sequence.",
    "detail_tags": [
      "Fatigue",
      "FEA",
      "Root Cause",
      "Heat Treatment",
      "S45C"
    ],
    "detail_media_html": "",
    "detail_body_style": "padding-top:32px",
    "detail_html": "<div class=\"pmdiv\"></div>\n    <div class=\"pm-fail-grid\">\n      <div class=\"pm-fail-cell\"><p class=\"pm-fail-label\">Failure Mode</p><p class=\"pm-fail-val\">Rotational bending fatigue at shaft shoulder (Ø53.5 → Ø52.5 mm). Classic beach marks on fracture surface confirm progressive fatigue crack propagation.</p></div>\n      <div class=\"pm-fail-cell\"><p class=\"pm-fail-label\">Material Condition</p><p class=\"pm-fail-val\">S45C steel — coarse grain structure, Widmanstätten microstructure indicating overheating (~880°C) and improper induction heat treatment.</p></div>\n      <div class=\"pm-fail-cell\"><p class=\"pm-fail-label\">Root Cause</p><p class=\"pm-fail-val\">Stress concentration at fillet (R0.1) · Shallow hardened layer · Semi-finish machining removed the treated surface at the highest-stress section.</p></div>\n      <div class=\"pm-fail-cell\"><p class=\"pm-fail-label\">Process Sequence Error</p><p class=\"pm-fail-val\">Heat treatment applied before final machining — negating the hardened surface layer precisely at the critical stress concentration location.</p></div>\n    </div>\n    <div class=\"pm-callout\" style=\"margin-top:22px\">\n      <p class=\"pm-callout-title\">Corrective Recommendations</p>\n      <ul>\n        <li>Increase fillet radius at shoulder transition: R0.1 → R ≥ 0.5 mm</li>\n        <li>Audit induction hardening parameters — reduce peak temperature to suppress grain coarsening</li>\n        <li>Revise sequence: Rough machine → Heat treat → Semi-finish (preserve hardened layer)</li>\n        <li>Add hardness verification step post semi-finish to confirm case depth retention</li>\n      </ul>\n    </div>"
  },
